root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/{{cookiecutter.project_slug}} ./cmd/{{cookiecutter.project_slug}}"
  bin = "./tmp/{{cookiecutter.project_slug}}"
  args_bin = ["serve"]
  include_ext = ["go", "html", "css", "js"]
  exclude_dir = ["tmp", "logs", ".agents", ".claude"]
  delay = 500
  kill_delay = "2s"
  send_interrupt = true

[log]
  main_only = true
