[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = "{{cookiecutter.description}}"
readme = "README.md"
authors = [
    { name = "{{cookiecutter.author}}", email = "{{cookiecutter.email}}" }
]
requires-python = ">=3.13"
dependencies = [
    "brotli>=1.1",
    "click>=8.1",
    "datastar-py>=1.0.2",
    "duckdb>=1.3",
    "httpx>=0.28",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "psutil>=6.0",
    "python-multipart>=0.0.20",
    "starlette>=0.47",
    "uvicorn[standard]>=0.35",
]

[project.scripts]
{{cookiecutter.project_slug}} = "{{cookiecutter.package_name}}.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{cookiecutter.package_name}}"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
