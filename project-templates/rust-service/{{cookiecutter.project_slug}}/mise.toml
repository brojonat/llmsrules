# mise is the front door: `mise tasks` lists everything, `mise run <task>`.
# Extra arguments are appended to a task's command; tasks that tee wrap the
# command in a function so appended args land on the server, not on tee.
# The Rust toolchain itself is pinned by rust-toolchain.toml (rustup).

[tools]
watchexec = "latest"

[env]
_.file = { path = ".env", redact = false }

[tasks.setup]
description = "Toolchain from rust-toolchain.toml, fetch crates, create .env"
run = [
  "rustup show active-toolchain",
  "cargo fetch --locked",
  "[ -f .env ] || cp .env.example .env",
]

[tasks.build]
description = "Release build to target/release/{{cookiecutter.project_slug}}"
run = "cargo build --release --locked"

[tasks.dev]
description = "Rebuild and restart on change, tee to logs/serve.log"
run = 'mkdir -p logs; f() { watchexec -r -e rs,toml,sql -- cargo run -q -- serve "$@" 2>&1 | tee logs/serve.log; }; f'

[tasks.serve]
description = "Run the release build, tee to logs/serve.log"
depends = ["build"]
run = 'mkdir -p logs; f() { target/release/{{cookiecutter.project_slug}} serve "$@" 2>&1 | tee logs/serve.log; }; f'

[tasks.token]
description = "Mint a dev bearer token: mise run token --sub alice | jq -r .token"
run = 'f() { cargo run -q -- token "$@"; }; f'

[tasks.test]
description = "Run tests (in-memory SQLite, no server needed)"
run = 'f() { cargo test -q "$@"; }; f'

[tasks.lint]
description = "clippy (warnings are errors) + rustfmt check"
run = ["cargo clippy -q --all-targets -- -D warnings", "cargo fmt --check"]

[tasks.fmt]
description = "rustfmt"
run = "cargo fmt"

[tasks.docker-build]
description = "Build the container image as {{cookiecutter.project_slug}}:dev"
run = "docker build -t {{cookiecutter.project_slug}}:dev ."

[tasks.deploy]
description = "Build, push and apply k8s/prod pinned to this commit (scripts/deploy.sh)"
run = "scripts/deploy.sh"

[tasks.logs]
description = "Follow the deployed service's logs"
run = "kubectl -n {{cookiecutter.k8s_namespace}} logs -f deployment/{{cookiecutter.project_slug}}"
