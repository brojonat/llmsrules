[package]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
edition = "2024"
description = "{{cookiecutter.description}}"
authors = ["{{cookiecutter.author}}"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
prometheus-client = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower-http = { version = "0.7", features = ["request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
