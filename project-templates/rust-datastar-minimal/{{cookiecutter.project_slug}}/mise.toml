# mise is the front door: `mise tasks` lists everything, `mise run <task>`.
# The Rust toolchain itself is pinned by rust-toolchain.toml (rustup).

[tools]
watchexec = "latest"

[env]
_.file = { path = ".env", redact = false }

[tasks.dev]
description = "Rebuild and restart on change, tee to logs/serve.log"
run = 'mkdir -p logs; f() { watchexec -r -e rs,toml,sql -- cargo run -q -- "$@" 2>&1 | tee logs/serve.log; }; f'

[tasks.test]
description = "Run tests (in-memory SQLite, no server needed)"
run = 'f() { cargo test -q "$@"; }; f'

[tasks.lint]
description = "clippy (warnings are errors) + rustfmt check"
run = ["cargo clippy -q --all-targets -- -D warnings", "cargo fmt --check"]

[tasks.fmt]
description = "rustfmt"
run = "cargo fmt"

[tasks.build]
description = "Release build to target/release/{{cookiecutter.project_slug}}"
run = "cargo build --release"
