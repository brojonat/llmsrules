services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for the lake's Parquet files. SeaweedFS with
  # no identities configured accepts any access key, so the .env.example
  # credentials work as-is. (MinIO no longer publishes community images.)
  s3:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbucket:
    image: chrislusf/seaweedfs:4.50
    depends_on:
      s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 's3.bucket.list' | weed shell -master=s3:9333 | grep -q lake-data ||
      echo 's3.bucket.create -name lake-data' | weed shell -master=s3:9333
      "

volumes:
  pgdata:
  s3data:
