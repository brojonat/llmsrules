[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = "{{cookiecutter.description}}"
readme = "README.md"
authors = [
    { name = "{{cookiecutter.author}}", email = "{{cookiecutter.email}}" }
]
requires-python = ">=3.13"
dependencies = [
    "arviz>=1.3.0",
    "blackjax>=1.7.1",
    "datastar-py>=1.0.3",
    "duckdb>=1.5.6,<1.6",
    "graphviz>=0.21",
    "jax>=0.11.2",
    "jinja2>=3.1.6",
    "matplotlib>=3.9",
    "numpyro>=0.22.0",
    "optax>=0.2.8",
    "pyarrow>=25.0.1",
    "pymc>=6.3.2",
    "starlette>=1.7.0",
    "uvicorn[standard]>=0.54.0",
    "watchfiles>=1.3.0",
]

[project.optional-dependencies]
# JAX's CUDA build (~3.5 GB of NVIDIA wheels): `mise run setup:gpu`. Without it, JAX runs on CPU.
gpu = ["jax[cuda13]>=0.11.2"]

[project.scripts]
{{cookiecutter.project_slug}} = "{{cookiecutter.package_name}}.cli:main"

[build-system]
requires = ["uv_build>=0.9.7"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint.isort]
# tests/ sorts after the package whatever the package is called (a generated
# project named after "tests" alphabetically would otherwise fail lint).
known-local-folder = ["tests"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:Explicitly requested dtype .* is not available"]
