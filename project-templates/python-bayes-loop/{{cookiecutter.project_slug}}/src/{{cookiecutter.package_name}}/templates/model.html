<section id="model">
{% if model %}
<div class="model-grid">
  <figure>
    <model-graph dot="{{ model.dot }}"></model-graph>
    <figcaption class="muted">{% if model.version %}v{{ model.version }} · {% endif %}{{ "git " ~ model.git_rev if model.git_rev else "not committed" }} · compiled for up to {{ model.n|num }} rows</figcaption>
  </figure>
  <div class="note">
    <h2>What this model says</h2>
    {% if note %}
      {% for para in note.text.strip().split("\n\n") %}<p>{{ para }}</p>{% endfor %}
    {% else %}
      <p class="muted">Waiting for the agent to describe this version (<code>{{ cli }} describe</code>).</p>
    {% endif %}
  </div>
</div>
{% endif %}
</section>
